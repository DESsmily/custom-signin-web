<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>签到管理系统</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2130;
    --card2: #212a3d;
    --border: #2d3850;
    --text: #e5eaf3;
    --muted: #8b96ad;
    --accent: #4f8cff;
    --accent-hover: #6ba1ff;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --yellow: #f7c948;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 600; }
  h1 .dot { color: var(--accent); }
  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 14px; cursor: pointer; transition: background .15s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary { background: var(--card2); border: 1px solid var(--border); color: var(--text); }
  .btn.secondary:hover { border-color: var(--accent); }
  .btn.small { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .btn.danger { background: transparent; border: 1px solid var(--border); color: var(--red); }
  .btn.danger:hover { border-color: var(--red); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: var(--muted); font-weight: 500; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .url-cell { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px;
  }
  .badge.success { background: rgba(62,207,142,.15); color: var(--green); }
  .badge.fail { background: rgba(255,107,107,.15); color: var(--red); }
  .badge.never { background: var(--card2); color: var(--muted); }
  .ops { display: flex; gap: 6px; flex-wrap: wrap; }

  /* 开关 */
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; cursor: pointer; }
  .switch input { display: none; }
  .switch .slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 22px; transition: .2s;
  }
  .switch .slider::before {
    content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; top: 3px; left: 3px; transition: .2s;
  }
  .switch input:checked + .slider { background: var(--green); }
  .switch input:checked + .slider::before { transform: translateX(18px); }

  /* 弹窗 */
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 100; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 22px;
  }
  .modal h3 { font-size: 17px; margin-bottom: 18px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; background: var(--card2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group textarea { resize: vertical; font-family: Consolas, monospace; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

  /* 日志 */
  .log-item {
    display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--border);
    font-size: 13px; align-items: baseline; flex-wrap: wrap;
  }
  .log-item:last-child { border-bottom: none; }
  .log-time { color: var(--muted); font-size: 12px; min-width: 140px; }
  .log-resp { color: var(--muted); font-size: 12px; word-break: break-all; flex: 1; }
  .empty { color: var(--muted); text-align: center; padding: 20px; font-size: 13px; }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--card2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 10px; font-size: 13px; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .25s; max-width: 90vw;
  }
  #toast.show { opacity: 1; }
  #toast.error { border-color: var(--red); color: var(--red); }

  /* OpenID 获取指引 */
  .helper-box {
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; font-size: 12px; color: var(--muted); line-height: 2; margin-bottom: 14px;
  }
  .helper-box b { color: var(--text); font-size: 13px; }
  .helper-box ol { margin: 6px 0 0 18px; }
  .helper-box a { color: var(--accent); }
  .helper-box code {
    background: var(--bg); padding: 2px 8px; border-radius: 5px;
    color: var(--yellow); font-size: 12px; word-break: break-all;
  }
  .helper-tip { margin-top: 6px; color: var(--yellow); }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⏰ 签到管理系统<span class="dot">.</span></h1>
    <div style="display:flex; gap:10px;">
      <button class="btn secondary" onclick="openNotifyModal()">🔔 通知设置</button>
      <button class="btn" id="btnCheckinAll" onclick="checkinAll()">⚡ 全部签到</button>
      <button class="btn" onclick="openItemModal()">＋ 新建签到项</button>
    </div>
  </header>

  <div class="card">
    <h2>签到任务</h2>
    <table>
      <thead>
        <tr>
          <th style="width:60px;">启用</th><th>名称</th><th>URL</th>
          <th>定时</th><th>上次结果</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="itemsBody"></tbody>
    </table>
    <div class="empty" id="itemsEmpty" style="display:none;">暂无签到任务，点击右上角「新建签到项」</div>
  </div>

  <div class="card">
    <h2>最近日志</h2>
    <div id="logsList"></div>
  </div>
</div>

<!-- 签到项弹窗 -->
<div class="modal-mask" id="itemModal">
  <div class="modal">
    <h3 id="itemModalTitle">新建签到项</h3>
    <input type="hidden" id="f_id">
    <div class="form-group"><label>名称 *</label><input id="f_name" placeholder="例如：发彩AI签到"></div>
    <div class="form-group"><label>请求 URL *</label><input id="f_url" placeholder="https://example.com/api/checkin"></div>
    <div class="form-row">
      <div class="form-group"><label>请求方法</label>
        <select id="f_method"><option>POST</option><option>GET</option><option>PUT</option></select>
      </div>
      <div class="form-group"><label>每日签到时间（HH:MM）</label><input id="f_time" value="08:00" placeholder="08:00"></div>
    </div>
    <div class="form-group"><label>自定义 Headers（JSON 对象，可选，将覆盖默认头）</label>
      <textarea id="f_headers" rows="3" placeholder='{"New-Api-User": "1057"}'></textarea>
    </div>
    <div class="form-group"><label>Cookie</label>
      <textarea id="f_cookie" rows="3" placeholder="session=xxx; other=yyy"></textarea>
    </div>
    <div class="form-group"><label>请求体 Body（可选）</label>
      <textarea id="f_body" rows="2" placeholder="留空则无请求体"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn secondary" onclick="closeModal('itemModal')">取消</button>
      <button class="btn" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- 通知设置弹窗 -->
<div class="modal-mask" id="notifyModal">
  <div class="modal">
    <h3>🔔 QQ 机器人通知设置</h3>
    <div class="form-group">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <span class="switch"><input type="checkbox" id="n_enabled"><span class="slider"></span></span>
        启用 QQ 机器人通知
      </label>
    </div>
    <div class="form-group"><label>App ID</label><input id="n_app_id" placeholder="QQ开放平台机器人 AppID"></div>
    <div class="form-group"><label>App Secret</label><input id="n_app_secret" type="password" placeholder="QQ开放平台机器人 Secret"></div>
    <div class="form-group"><label>接收人 OpenID</label><input id="n_openid" placeholder="用户的 openid"></div>
    <div class="helper-box">
      <b>📥 如何获取 OpenID</b>
      <ol>
        <li>确保本机已安装 Node.js（18 及以上）</li>
        <li><a href="/download/openid-helper.mjs" download>⬇ 下载 openid-helper.mjs</a></li>
        <li>在本机执行：<code id="helperCmd">node openid-helper.mjs 你的AppID 你的AppSecret</code>
          <button class="btn small secondary" onclick="copyHelperCmd()">复制</button></li>
        <li>⚠️ 运行后 <b>60 秒内</b>用手机 QQ 给机器人发送一条私聊消息，终端会打印出你的 OpenID</li>
      </ol>
      <div class="helper-tip">前提：已在 QQ 开放平台（q.qq.com）为机器人开通「私聊消息」事件权限</div>
    </div>
    <div class="modal-footer" style="justify-content:space-between;">
      <button class="btn secondary" onclick="testNotify()">发送测试消息</button>
      <div style="display:flex; gap:10px;">
        <button class="btn secondary" onclick="closeModal('notifyModal')">取消</button>
        <button class="btn" onclick="saveNotify()">保存</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

function toast(msg, isError) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 3000);
}

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(url, opts);
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(data.error || data.message || `HTTP ${resp.status}`);
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function badge(status) {
  if (status === 'success') return '<span class="badge success">✅ 成功</span>';
  if (status === 'fail') return '<span class="badge fail">❌ 失败</span>';
  return '<span class="badge never">未执行</span>';
}

// ---------------- 签到项 ----------------
async function loadItems() {
  try {
    const { items } = await api('GET', '/api/items');
    const tbody = $('itemsBody');
    $('itemsEmpty').style.display = items.length ? 'none' : 'block';
    tbody.innerHTML = items.map(it => `
      <tr>
        <td><span class="switch"><input type="checkbox" ${it.enabled ? 'checked' : ''} onchange="toggleItem(${it.id}, this.checked)"><span class="slider"></span></span></td>
        <td>${esc(it.name)}</td>
        <td class="url-cell" title="${esc(it.url)}">${esc(it.url)}</td>
        <td>🕐 ${esc(it.schedule_time)}</td>
        <td>${badge(it.last_status)}${it.last_time ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;">${esc(it.last_time)}</div>` : ''}</td>
        <td><div class="ops">
          <button class="btn small" onclick="checkinOne(${it.id})">签到</button>
          <button class="btn small secondary" onclick="openItemModal(${it.id})">编辑</button>
          <button class="btn small danger" onclick="deleteItem(${it.id})">删除</button>
        </div></td>
      </tr>`).join('');
  } catch (e) { toast('加载签到项失败：' + e.message, true); }
}

function openItemModal(id) {
  const m = $('itemModal');
  if (id) {
    $('itemModalTitle').textContent = '编辑签到项';
    api('GET', '/api/items').then(({ items }) => {
      const it = items.find(x => x.id === id);
      if (!it) return;
      $('f_id').value = it.id; $('f_name').value = it.name; $('f_url').value = it.url;
      $('f_method').value = it.method; $('f_time').value = it.schedule_time;
      $('f_headers').value = it.headers || ''; $('f_cookie').value = it.cookie || '';
      $('f_body').value = it.body || '';
    });
  } else {
    $('itemModalTitle').textContent = '新建签到项';
    $('f_id').value = ''; $('f_name').value = ''; $('f_url').value = '';
    $('f_method').value = 'POST'; $('f_time').value = '08:00';
    $('f_headers').value = ''; $('f_cookie').value = ''; $('f_body').value = '';
  }
  m.classList.add('show');
}

async function saveItem() {
  const id = $('f_id').value;
  const body = {
    name: $('f_name').value, url: $('f_url').value, method: $('f_method').value,
    schedule_time: $('f_time').value, headers: $('f_headers').value,
    cookie: $('f_cookie').value, body: $('f_body').value,
  };
  try {
    if (id) await api('PUT', `/api/items/${id}`, body);
    else await api('POST', '/api/items', body);
    closeModal('itemModal');
    toast('保存成功');
    loadItems();
  } catch (e) { toast('保存失败：' + e.message, true); }
}

async function toggleItem(id, enabled) {
  try {
    await api('PUT', `/api/items/${id}`, { enabled });
    toast(enabled ? '已启用定时签到' : '已停用');
  } catch (e) { toast('操作失败：' + e.message, true); loadItems(); }
}

async function deleteItem(id) {
  if (!confirm('确定删除该签到项？')) return;
  try {
    await api('DELETE', `/api/items/${id}`);
    toast('已删除');
    loadItems();
  } catch (e) { toast('删除失败：' + e.message, true); }
}

// ---------------- 签到 ----------------
async function checkinOne(id) {
  toast('正在签到...');
  try {
    const { result } = await api('POST', `/api/items/${id}/checkin`);
    toast(`${result.name}：${result.status === 'success' ? '✅ 签到成功' : '❌ 签到失败'}`,
      result.status !== 'success');
    loadItems(); loadLogs();
  } catch (e) { toast('签到失败：' + e.message, true); }
}

async function checkinAll() {
  const btn = $('btnCheckinAll');
  btn.disabled = true; btn.textContent = '⏳ 签到中...';
  try {
    const { results } = await api('POST', '/api/checkin/all');
    const ok = results.filter(r => r.status === 'success').length;
    toast(`全部签到完成：成功 ${ok} / 共 ${results.length} 项`, ok !== results.length);
    loadItems(); loadLogs();
  } catch (e) { toast('全部签到失败：' + e.message, true); }
  btn.disabled = false; btn.textContent = '⚡ 全部签到';
}

// ---------------- 通知设置 ----------------
async function openNotifyModal() {
  try {
    const { config } = await api('GET', '/api/notify');
    $('n_enabled').checked = config.enabled;
    $('n_app_id').value = config.app_id || '';
    $('n_app_secret').value = config.app_secret || '';
    $('n_openid').value = config.user_openid || '';
    updateHelperCmd();
    $('notifyModal').classList.add('show');
  } catch (e) { toast('加载通知配置失败：' + e.message, true); }
}

function updateHelperCmd() {
  const appId = $('n_app_id').value.trim() || '你的AppID';
  $('helperCmd').textContent = `node openid-helper.mjs ${appId} 你的AppSecret`;
}

async function copyHelperCmd() {
  try {
    await navigator.clipboard.writeText($('helperCmd').textContent);
    toast('命令已复制');
  } catch (e) {
    // 剪贴板API不可用时降级
    const ta = document.createElement('textarea');
    ta.value = $('helperCmd').textContent;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    toast('命令已复制');
  }
}

async function saveNotify() {
  try {
    await api('PUT', '/api/notify', {
      enabled: $('n_enabled').checked,
      app_id: $('n_app_id').value.trim(),
      app_secret: $('n_app_secret').value.trim(),
      user_openid: $('n_openid').value.trim(),
    });
    closeModal('notifyModal');
    toast('通知配置已保存');
  } catch (e) { toast('保存失败：' + e.message, true); }
}

async function testNotify() {
  try {
    // 先保存再测试，避免测的是旧配置
    await api('PUT', '/api/notify', {
      enabled: true,
      app_id: $('n_app_id').value.trim(),
      app_secret: $('n_app_secret').value.trim(),
      user_openid: $('n_openid').value.trim(),
    });
    const r = await api('POST', '/api/notify/test');
    toast('测试消息发送成功');
  } catch (e) { toast('测试失败：' + e.message, true); }
}

// ---------------- 日志 ----------------
async function loadLogs() {
  try {
    const { logs } = await api('GET', '/api/logs');
    $('logsList').innerHTML = logs.length ? logs.map(l => `
      <div class="log-item">
        <span class="log-time">${esc(l.created_at)}</span>
        ${badge(l.status)}
        <span>${esc(l.item_name)}</span>
        <span style="color:var(--muted)">${esc(l.trigger_type === 'auto' ? '定时' : '手动')}</span>
        ${l.http_code ? `<span style="color:var(--muted)">HTTP ${l.http_code}</span>` : ''}
        <span class="log-resp">${esc(l.response)}</span>
      </div>`).join('') : '<div class="empty">暂无日志</div>';
  } catch (e) { /* 静默 */ }
}

function closeModal(id) { $(id).classList.remove('show'); }

$('n_app_id').addEventListener('input', updateHelperCmd);

document.querySelectorAll('.modal-mask').forEach(m =>
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));

loadItems();
loadLogs();
setInterval(loadLogs, 15000);
</script>
</body>
</html>
